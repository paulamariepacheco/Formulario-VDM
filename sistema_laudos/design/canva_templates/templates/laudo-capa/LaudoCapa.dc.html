<!--
  Capa do laudo - markup REAL do Claude Design ("Paula Pacheco Design System",
  projectId 1429c6fb-e92f-4c44-a2bd-3c70304f9031), anotado com o contrato de
  dados lido por gerador/render_paginas.py. O original intocado (com os dados
  de exemplo do laudo 54/2026) vive ao lado, em LaudoCapa.original.dc.html -
  ao re-sincronizar o design, diffar contra ele e reaplicar as anotacoes.

  Anotacoes aplicadas sobre o original (nada de estilo foi alterado):
    - placeholders de chaves duplas nos nos de dado: numero, nome_imovel,
      endereco, cliente_linha, emissao, perita_capa, credenciais_linha,
      foto_capa;
    - os dois blocos condicionais do original (prop "fundo") viraram pares de
      comentario de variante: "foto-com-overlay" = foto full-bleed + gradiente;
      "foto-moldura" = foto emoldurada com cantoneiras (ativa no fundo
      azul-marinho QUANDO ha foto; sem foto o espacador flex absorve a area);
    - os slots de imagem do runtime viraram tags img simples;
    - as tres cores primarias da marca usam var(--pp-*) com o hex original de
      fallback (tokens.json continua fonte da verdade via /design-sync); os
      tons da escala navy (200/300/900) e os rgba do gradiente permanecem
      literais do design - nao existem em tokens.json.

  IMPORTANTE: neste comentario de cabecalho, nunca escrever a tag do container
  literal, marcadores de variante entre delimitadores de comentario, nem a
  sequencia que fecha comentario HTML.
-->
